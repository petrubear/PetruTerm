[package]
name = "remote-proto"
version = "0.1.0"
edition = "2021"
description = "PetruTerm remote access protocol: Noise sessions, framing, messages, pairing codes"
license = "MIT"

[lib]

[dependencies]
snow = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
thiserror = "2"
